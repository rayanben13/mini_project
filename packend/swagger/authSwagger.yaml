openapi: 3.0.0
info:
  title: Mini Project API
  description: API endpoints for Mini Project Authentication and User Info Management.
  version: 1.0.0
tags:
  - name: Auth
    description: Authentication and identity management
  - name: User
    description: User profile and information management

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - username
        - fullname
      properties:
        email:
          type: string
          format: email
          example: 'ilyesdevelops@example.com'
        password:
          type: string
          format: password
          example: 'StrongPass123!'
        username:
          type: string
          minLength: 3
          maxLength: 30
          example: 'ilyes123'
        fullname:
          type: string
          minLength: 3
          maxLength: 30
          example: 'Ilyes Developer'

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: 'ilyesdevelops@example.com'
        password:
          type: string
          format: password
          example: 'StrongPass123!'

    EmailRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: 'ilyesdevelops@example.com'

    VerifyRequest:
      type: object
      required:
        - email
        - code
      properties:
        email:
          type: string
          format: email
          example: 'ilyesdevelops@example.com'
        code:
          type: string
          description: Verification code sent to email
          example: '123456'

    ResetPasswordRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: 'ilyesdevelops@example.com'
        password:
          type: string
          format: password
          example: 'NewStrongPass123!'

    UserInformationRequest:
      type: object
      required:
        - univ
        - major
        - academic_year
      properties:
        univ:
          type: string
          example: "Université d'Alger"
        major:
          type: string
          example: 'Computer Science'
        spercialty:
          type: string
          example: 'Software Engineering'
        academic_year:
          type: string
          enum: [L1, L2, L3, M1, M2]
          example: 'L3'

    UpdateProfileRequest:
      type: object
      required:
        - fullname
        - univ
        - major
        - academic_year
      properties:
        fullname:
          type: string
          minLength: 3
          maxLength: 30
          example: 'Ilyes Developer'
        univ:
          type: string
          minLength: 5
          maxLength: 50
          example: "Université d'Alger"
        major:
          type: string
          minLength: 3
          maxLength: 30
          example: 'Computer Science'
        spercialty:
          type: string
          minLength: 2
          maxLength: 30
          example: 'Software Engineering'
        academic_year:
          type: string
          enum: [L1, L2, L3, M1, M2]
          example: 'L3'
        img_user:
          type: string
          format: binary
          description: Profile image file (for multipart/form-data)

    UploadFileRequest:
      type: object
      required:
        - title
        - univ
        - major
        - academic_year
        - subject
        - type
        - creation_year
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 100
          example: 'Calculus I Notes'
        univ:
          type: string
          minLength: 5
          maxLength: 50
          example: "Université d'Alger"
        major:
          type: string
          minLength: 3
          maxLength: 30
          example: 'Computer Science'
        academic_year:
          type: string
          enum: [L1, L2, L3, M1, M2]
          example: 'L3'
        spercialty:
          type: string
          minLength: 2
          maxLength: 30
          example: 'Software Engineering'
        subject:
          type: string
          minLength: 3
          maxLength: 100
          example: 'Mathematics'
        type:
          type: string
          enum: [TD, TP, COURS, EF, CC, RESUME, OTHER]
          example: 'COURS'
        creation_year:
          type: integer
          minimum: 2000
          maximum: 2025
          example: 2023

    ReportFileRequest:
      type: object
      required:
        - reason
        - details
      properties:
        reason:
          type: string
          enum: ['Inappropriate content', 'COPYRIGHT issuse', 'Spam or misleading', 'Incorrect information', 'Other']
          example: 'Spam or misleading'
        details:
          type: string
          minLength: 3
          maxLength: 500
          example: 'This file contains incorrect information about...'

    LikeFileRequest:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum: [LIKE, DISLIKE]
          example: 'LIKE'

    StudyListRequest:
      type: object
      required:
        - name
        - subject
        - description
        - privacy
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
          example: 'My Math List'
        subject:
          type: string
          minLength: 3
          maxLength: 100
          example: 'Mathematics'
        description:
          type: string
          minLength: 3
          maxLength: 500
          example: 'A collection of math resources'
        privacy:
          type: string
          enum: [public, private]
          example: 'public'

    EditStudyListRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
          example: 'Updated Math List'
        description:
          type: string
          minLength: 3
          maxLength: 500
          example: 'Updated collection description'
        privacy:
          type: string
          enum: [public, private]
          example: 'private'

    ReminderRequest:
      type: object
      required:
        - date
        - time
      properties:
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          example: '2023-12-31'
        time:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: '14:30'

paths:
  /api/auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      description: Creates a new user and sends a verification code to their email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Verification code sent successfully
          content:
            application/json:
              example:
                message: 'Verification code sent to email'
                email: 'ilyesdevelops@example.com'
        '404':
          description: Email or username already exists
          content:
            application/json:
              example:
                error: 'Email or user name is exist '
        '500':
          description: Server error
          content:
            application/json:
              example:
                error: 'Server error'

  /api/auth/resendVerificationCode:
    post:
      tags:
        - Auth
      summary: Resend Verification Code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                message: 'New verification code sent to your email'
        '404':
          description: Email does not exist
          content:
            application/json:
              example:
                error: 'Email is NOT exist '
        '500':
          description: Server error
          content:
            application/json:
              example:
                error: 'Server error'

  /api/auth/verify:
    post:
      tags:
        - Auth
      summary: Verify Email Code
      description: Verifies the email address using the confirmation code. Returns access token (refresh token in HttpOnly cookie).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
      responses:
        '200':
          description: Verified successfully
          content:
            application/json:
              example:
                message: 'Email verified successfully'
                role: 'user'
                accessToken: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        '400':
          description: Invalid or expired code, or user not found
          content:
            application/json:
              examples:
                invalid_expired:
                  summary: Code expired or invalid
                  value:
                    message: 'Code expired or invalid'
                invalid_code:
                  summary: Invalid code
                  value:
                    message: 'Invalid code'
                user_not_found:
                  summary: User not found
                  value:
                    message: 'User not found or already verified'
        '500':
          description: Server error
          content:
            application/json:
              example:
                error: 'Server error'

  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Login user
      description: Authenticates user and returns an access token. Refresh token is set in cookies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '201':
          description: Successfully logged in
          content:
            application/json:
              example:
                role: 'user'
                accessToken: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        '403':
          description: Email not verified
          content:
            application/json:
              example:
                error: 'Email not verified'
        '404':
          description: Invalid credentials or missing user information
          content:
            application/json:
              examples:
                email_not_exist:
                  summary: Email does not exist
                  value:
                    error: 'Email is NOT exist '
                missing_info:
                  summary: User information missing
                  value:
                    error: 'User information is NOT exist '
                invalid_credentials:
                  summary: Invalid password or email
                  value:
                    error: 'password or Email is not exist'
        '500':
          description: Server error
          content:
            application/json:
              example:
                error: 'Server error'

  /api/auth/forgotPassword:
    post:
      tags:
        - Auth
      summary: Forgot Password
      description: Sends a password reset link to the provided email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '200':
          description: Password reset link sent successfully
          content:
            application/json:
              example:
                message: 'Password reset link sent to your email'
        '404':
          description: Email does not exist
          content:
            application/json:
              example:
                error: 'Email is NOT exist '
        '500':
          description: Server error
          content:
            application/json:
              example:
                error: 'Server error'

  /api/auth/resetPassword/{resetTokenURL}:
    patch:
      tags:
        - Auth
      summary: Reset Password
      description: Resets user's password using the token received via email.
      parameters:
        - name: resetTokenURL
          in: path
          required: true
          example: 'a1b2c3d4e5f6g7h8'
          schema:
            type: string
          description: The password reset token from the URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password updated successfully
          content:
            application/json:
              example:
                message: 'Update password is done'
        '400':
          description: Invalid or expired reset token
          content:
            application/json:
              example:
                message: 'Invalid or expired reset token'
        '500':
          description: Server error
          content:
            application/json:
              example:
                error: 'Server error'

  /api/auth/logout:
    post:
      tags:
        - Auth
      summary: Logout user
      description: Clears the refresh token cookie.
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              example:
                message: 'Logged out'

  /api/auth/token:
    post:
      tags:
        - Auth
      summary: Refresh Access Token
      description: Generates a new access token using the refresh token from cookies.
      responses:
        '200':
          description: Successfully refreshed token
          content:
            application/json:
              example:
                accessToken: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        '401':
          description: No refresh token (Not logged in)
          content:
            application/json:
              example:
                error: 'No refresh token'
        '403':
          description: Invalid refresh token
          content:
            application/json:
              example:
                error: 'Invalid refresh token'

  /api/auth/SharchMoreInformation:
    get:
      tags:
        - Auth
      summary: Search University/Major Information
      description: Search universities, majors, specialties, or subjects. Returns results in a 'data' array.
      parameters:
        - name: mode
          in: query
          required: true
          example: 'univ'
          schema:
            type: string
            enum: [univ, major, specialty, subject]
          description: 'Search mode ("univ", "major", "specialty", "subject")'
        - name: name
          in: query
          required: true
          example: 'Alger'
          schema:
            type: string
          description: Search query
        - name: year
          in: query
          example: 'L3'
          schema:
            type: string
          description: Academic year (required if mode is specialty or subject)
        - name: major
          in: query
          example: 'Computer Science'
          schema:
            type: string
          description: Major name (required if mode is specialty or subject)
        - name: specialization
          in: query
          example: 'Software Engineering'
          schema:
            type: string
          description: Specialization name (required if mode is subject and year is not L1, L2, L3)
      responses:
        '200':
          description: Search results successfully fetched
          content:
            application/json:
              examples:
                univ_results:
                  summary: University search results
                  value:
                    data:
                      - "Université M'hamed Bouguerra de Boumerdes"
                      - "Université Mentouri Constantine"
                major_results:
                  summary: Major search results
                  value:
                    data:
                      - 'Computer Science'
                      - 'Data Science'
                specialty_results:
                  summary: Specialty search results
                  value:
                    data:
                      - 'SOFTWARE ENGINEERING'
                      - 'ARTIFICIAL INTELLIGENCE'
                subject_results:
                  summary: Subject search results
                  value:
                    data:
                      - 'Mathematics'
                      - 'Algorithmics'
        '400':
          description: Missing or invalid parameters
          content:
            application/json:
              examples:
                missing_params:
                  summary: Missing mode or name
                  value:
                    message: 'mode and name are required'
                missing_year_major:
                  summary: Missing year or major (specialty/subject mode)
                  value:
                    message: 'year and major are required'
                specialty_not_available:
                  summary: Specialty not available for L1/L2/L3
                  value:
                    message: 'Specialization not available for this year'
                missing_specialization:
                  summary: Missing specialization (subject mode)
                  value:
                    message: 'specialization is required'
                invalid_mode:
                  summary: Invalid search mode
                  value:
                    message: 'Invalid mode'
        '404':
          description: No results found
          content:
            application/json:
              example:
                message: 'No results found'
        '500':
          description: Server error
          content:
            application/json:
              example:
                error: 'Server error'

  /api/auth/addedUserInformation:
    post:
      tags:
        - Auth
      summary: Add User Specific Information
      description: Links user to specific university, major, and specialty. Requires Authentication.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInformationRequest'
      responses:
        '200':
          description: Information added successfully
          content:
            application/json:
              example:
                message: 'information is added'
                user_information:
                  id_user: 123
                  university: "Université d'Alger"
                  major: 'Computer Science'
                  specialization: 'SOFTWARE ENGINEERING'
                  academic_year: 'L3'
        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                error: 'Unauthorized'
        '404':
          description: Error with requested data (university does not exist, info not valid, or info already added)
          content:
            application/json:
              examples:
                not_user:
                  summary: User role required
                  value:
                    message: 'you are not user'
                univ_not_exist:
                  summary: University not found
                  value:
                    message: 'university is not exist'
                info_not_valid:
                  summary: Information not found in database
                  value:
                    message: 'you are not added this information'
                info_already_exist:
                  summary: Profile already exists
                  value:
                    message: 'you added information is already exist'
        '500':
          description: Server error
          content:
            application/json:
              example:
                error: 'Server error'

