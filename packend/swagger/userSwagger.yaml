openapi: 3.0.0
info:
  title: User API
  description: API endpoints for user profile and information management.
  version: 1.0.0
tags:
  - name: User
    description: User profile and information management

paths:
  /api/user/MyInformation:
    get:
      tags:
        - User
      summary: Get current authenticated user details
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User information Fetched Successfully
          content:
            application/json:
              example:
                result:
                  username: 'ilyes123'
                  fullname: 'Ilyes Developer'
                  img_user: 'avatar.png'
                  email: 'ilyesdevelops@example.com'
                  role: 'user'
                  user_information:
                    university: "Université d'Alger"
                    major: 'Computer Science'
                    specialization: 'SOFTWARE ENGINEERING'
                    academic_year: 'L3'
        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                message: 'Unauthorized'
