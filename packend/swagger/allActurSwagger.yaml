tags:
  - name: Search
    description: Search for files and subjects

paths:
  /api/search/searchFiles:
    get:
      summary: Search for files across the platform
      tags: [Search]
      parameters:
        - in: query
          name: title
          schema:
            type: string
          description: Filter by file title (contains/insensitive)
        - in: query
          name: university
          schema:
            type: string
          description: Filter by university
        - in: query
          name: major
          schema:
            type: string
          description: Filter by major
        - in: query
          name: academic_year
          schema:
            type: string
          description: Filter by academic year
        - in: query
          name: specialization
          schema:
            type: string
          description: Filter by specialization
        - in: query
          name: type
          schema:
            type: string
          description: Filter by file type
        - in: query
          name: year_creation
          schema:
            type: string
          description: Filter by creation year
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Number of items per page (max 50)
      responses:
        "200":
          description: Successful search results
          content:
            application/json:
              example:
                meta:
                  current_page: 1
                  last_page: 5
                  per_page: 10
                  total_files: 48
                  from: 1
                  to: 10
                data:
                  - id_file: 1
                    file_path: "https://res.cloudinary.com/..."
                    title: "Calculus I Notes"
                    type_file: "PDF"
                    major: "Computer Science"
                    specialization: "AI"
                    academic_year: "L1"
                    course: "Mathematics"
                    status: "accepted"
        "500":
          description: Internal Server Error
          content:
            application/json:
              example:
                error: "Server error"

  /api/search/searchSubjects:
    get:
      summary: Search for subjects across the platform
      tags: [Search]
      parameters:
        - in: query
          name: course
          schema:
            type: string
          description: Filter by course name
        - in: query
          name: major
          schema:
            type: string
          description: Filter by major
        - in: query
          name: academic_year
          schema:
            type: string
          description: Filter by academic year
        - in: query
          name: specialization
          schema:
            type: string
          description: Filter by specialization
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Number of items per page
      responses:
        "200":
          description: Successful search results
          content:
            application/json:
              example:
                meta:
                  current_page: 1
                  last_page: 2
                  per_page: 10
                  total_subjects: 15
                  from: 1
                  to: 10
                data:
                  - id_subject: 5
                    course: "Linear Algebra"
                    major: "Mathematics"
                    specialization: null
                    academic_year: "L1"
                    _count:
                      files: 25
        "500":
          description: Internal Server Error
          content:
            application/json:
              example:
                error: "Server error"