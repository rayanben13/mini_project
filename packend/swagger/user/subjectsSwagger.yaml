tags:
  - name: Subjects
    description: Subject and module operations

paths:
  /api/subjects/your-subjects:
    get:
      summary: Get user subjects based on major/level
      tags: [Subjects]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Number of subjects per page
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
      responses:
        '200':
          description: A list of subjects with pagination metadata for the user's major/level
          content:
            application/json:
              example:
                meta:
                  current_page: 1
                  last_page: 2
                  per_page: 10
                  total_subjects: 15
                  from: 1
                  to: 10
                data:
                  - id_subject: 1
                    course: 'Mathematical Analysis'
                    major: 'Computer Science'
                    specialization: 'Software Engineering'
                    academic_year: 'L3'
                    _count:
                      files: 5
                  - id_subject: 2
                    course: 'Computer Science I'
                    major: 'Computer Science'
                    specialization: 'Software Engineering'
                    academic_year: 'L3'
                    _count:
                      files: 3
        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                error: 'Unauthorized'
        '403':
          description: Forbidden - User role not allowed or profile incomplete
          content:
            application/json:
              examples:
                NotAUser:
                  summary: Not a user role
                  value:
                    message: 'You are not user'

        '422':
          description: Unprocessable Entity - Profile information missing
          content:
            application/json:
              example:
                message: 'Complete your profile first'
        '500':
          description: Server error
          content:
            application/json:
              example:
                error: 'Server error'

  /api/subjects/subject/{id_subject}:
    get:
      summary: Get details of a specific subject
      tags: [Subjects]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id_subject
          required: true
          schema:
            type: integer
          description: The subject ID
        - in: query
          name: page_files
          schema:
            type: integer
            default: 1
          description: Page number for files
        - in: query
          name: limit_files
          schema:
            type: integer
            default: 10
          description: Items per page for files
        - in: query
          name: page_lists
          schema:
            type: integer
            default: 1
          description: Page number for study lists
        - in: query
          name: limit_lists
          schema:
            type: integer
            default: 5
          description: Items per page for study lists
      responses:
        '200':
          description: Subject details including paginated files (grouped by type) and study lists
          content:
            application/json:
              example:
                subject:
                  id_subject: 1
                  course: 'Mathematical Analysis'
                  major: 'Computer Science'
                  specialization: 'Software Engineering'
                  academic_year: 'L3'
                  course_description: 'Introduction to calculus and limits'
                files:
                  TD:
                    - id_file: 101
                      file_path: 'https://cloudinary.com/...'
                      title: 'Limits_Lecture_Notes'
                      type: 'TD'
                      status: 'accepted'
                  TP: []
                  COURS:
                    - id_file: 102
                      file_path: 'https://cloudinary.com/...'
                      title: 'Derivatives_Theory'
                      type: 'COURS'
                      status: 'accepted'
                  EF: []
                  CC: []
                  RESUME: []
                  OTHER: []
                files_meta:
                  current_page: 1
                  last_page: 1
                  per_page: 10
                  total: 2
                  from: 1
                  to: 2
                study_lists:
                  - id_stuList: 5
                    name: 'Final Exam Prep'
                    privacy: 'public'
                    users:
                      id_user: 123
                      fullname: 'John Doe'
                    _count:
                      study_list_files: 10
                lists_meta:
                  current_page: 1
                  last_page: 3
                  per_page: 5
                  total: 12
                  from: 1
                  to: 5
        '400':
          description: Invalid subject ID
          content:
            application/json:
              example:
                error: 'Invalid subject ID'
        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                error: 'Unauthorized'

        '404':
          description: Subject not found
          content:
            application/json:
              example:
                error: 'Subject not found'
        '500':
          description: Server error
          content:
            application/json:
              example:
                error: 'Server error'
