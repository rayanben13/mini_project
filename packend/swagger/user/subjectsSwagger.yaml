tags:
  - name: Subjects
    description: Subject and module operations

paths:
  /api/subjects/your-subjects:
    get:
      summary: Get user subjects based on major/level
      tags: [Subjects]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Number of subjects per page
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
      responses:
        '200':
          description: A list of subjects with pagination metadata for the user's major/level
          content:
            application/json:
              example:
                meta:
                  current_page: 1
                  last_page: 2
                  per_page: 10
                  total_subjects: 15
                  from: 1
                  to: 10
                data:
                  - id_subject: 1
                    course: 'Mathematical Analysis'
                    major: 'Computer Science'
                    specialization: 'Software Engineering'
                    academic_year: 'L3'
                    _count:
                      files: 5
                  - id_subject: 2
                    course: 'Computer Science I'
                    major: 'Computer Science'
                    specialization: 'Software Engineering'
                    academic_year: 'L3'
                    _count:
                      files: 3
        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                error: 'Unauthorized'
        '403':
          description: Forbidden - User role not allowed or profile incomplete
          content:
            application/json:
              examples:
                NotAUser:
                  summary: Not a user role
                  value:
                    message: 'You are not user'

        '422':
          description: Unprocessable Entity - Profile information missing
          content:
            application/json:
              example:
                message: 'Complete your profile first'
        '500':
          description: Server error
          content:
            application/json:
              example:
                error: 'Server error'
