tags:
  - name: StudyLists
    description: Study list operations and management

paths:
  /api/studyList/showRecommendedStudyList:
    get:
      summary: Show recommended study lists for the user
      tags: [StudyLists]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Limit the number of items returned
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination
      responses:
        '200':
          description: A list of public recommended study lists based on user's profile
          content:
            application/json:
              example:
                meta:
                  current_page: 1
                  last_page: 5
                  per_page: 10
                  total_recommended_study_list: 48
                  from: 1
                  to: 10
                data:
                  - id_stuList: 1
                    name: 'Mathematics Prep'
                    users:
                      id_user: 5
                      fullname: 'John Doe'
                    count_files: 12
        '401':
          description: Unauthorized - Token missing or invalid
          content:
            application/json:
              example:
                error: 'Unauthorized'
        '403':
          description: Forbidden - User role not allowed or profile incomplete
          content:
            application/json:
              examples:
                NotAUser:
                  summary: Not a user role
                  value:
                    message: 'You are not user'

        '422':
          description: Unprocessable Entity - Profile information missing
          content:
            application/json:
              example:
                message: 'Complete your profile first'
        '500':
          description: Internal Server Error
          content:
            application/json:
              example:
                error: 'Server error'

  /api/studyList/showMyStudyList:
    get:
      summary: Show user's own study lists
      tags: [StudyLists]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Limit the number of items returned
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination
      responses:
        '200':
          description: A list of study lists created by the authenticated user
          content:
            application/json:
              example:
                meta:
                  current_page: 1
                  last_page: 1
                  per_page: 10
                  total_my_study_list: 3
                  from: 1
                  to: 3
                data:
                  - id_stuList: 10
                    name: 'My Physics Exams'
                    users:
                      id_user: 5
                      fullname: 'John Doe'
                    count_files: 5
        '401':
          description: Unauthorized - Token missing or invalid
          content:
            application/json:
              example:
                error: 'Unauthorized'
        '403':
          description: Forbidden - User role not allowed or profile incomplete
          content:
            application/json:
              examples:
                NotAUser:
                  summary: Not a user role
                  value:
                    message: 'You are not user'

        '422':
          description: Unprocessable Entity - Profile information missing
          content:
            application/json:
              example:
                message: 'Complete your profile first'
        '500':
          description: Internal Server Error
          content:
            application/json:
              example:
                error: 'Server error'

  /api/studyList/showAddedStudyList:
    get:
      summary: Show study lists added by the user from others
      tags: [StudyLists]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Limit the number of items returned
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination
      responses:
        '200':
          description: A list of other users' study lists that the current user has saved to their collection
          content:
            application/json:
              example:
                meta:
                  current_page: 1
                  last_page: 1
                  per_page: 10
                  total_added_study_list: 2
                  from: 1
                  to: 2
                data:
                  - id_user: 5
                    id_stuList: 25
                    name: 'Advanced Chemistry'
                    users:
                      id_user: 12
                      fullname: 'Sarah Smith'
                    count_files: 8
        '401':
          description: Unauthorized - Token missing or invalid
          content:
            application/json:
              example:
                error: 'Unauthorized'
        '403':
          description: Forbidden - User role not allowed or profile incomplete
          content:
            application/json:
              examples:
                NotAUser:
                  summary: Not a user role
                  value:
                    message: 'You are not user'

        '422':
          description: Unprocessable Entity - Profile information missing
          content:
            application/json:
              example:
                message: 'Complete your profile first'
        '500':
          description: Internal Server Error
          content:
            application/json:
              example:
                error: 'Server error'

  /api/studyList/showDetailStudyList/{id_stuList}:
    get:
      summary: Get details of a specific study list
      tags: [StudyLists]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id_stuList
          required: true
          schema:
            type: integer
          description: Study list ID
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Limit the number of items returned
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination
      responses:
        '200':
          description: Comprehensive details of the study list including the files contained within it
          content:
            application/json:
              example:
                meta:
                  current_page: 1
                  last_page: 1
                  per_page: 10
                  totalFilesStudyList: 2
                  from: 1
                  to: 2
                studyListCard:
                  id_stuList: 1
                  name: 'Mathematics Prep'
                  description: 'All files for Math exam'
                  privacy: 'public'
                  created_at: '2023-10-01T10:00:00Z'
                  users:
                    id_user: 5
                    fullname: 'John Doe'
                  count_files: 2
                  count_loved: 15
                  isLoved: true
                  isOwner: false
                  isSaved: true
                  isAddReminder: false
                  reminder_time: null
                FilesStudylist:
                  - id_file: 12
                    file_path: 'https://...'
                    title: 'Algebra Notes'
                    status: 'accepted'
                    subjects:
                      id_subject: 1
                      major: 'Computer Science'
                      specialization: null
                      course: 'Algebra'
        '403':
          description: Forbidden - User role not allowed, profile incomplete, or access denied
          content:
            application/json:
              examples:
                NotAUser:
                  summary: Not a user role
                  value:
                    message: 'You are not user'
                ProfileIncomplete:
                  summary: Profile information missing
                  value:
                    message: 'Complete your profile first'
                AccessDenied:
                  summary: Private study list access denied
                  value:
                    error: 'You are not authorized to access this study list'
        '404':
          description: Not Found - Study list ID does not exist
          content:
            application/json:
              example:
                error: 'Study list not found'
        '422':
          description: Unprocessable Entity - Profile information missing
          content:
            application/json:
              example:
                message: 'Complete your profile first'
        '500':
          description: Internal Server Error
          content:
            application/json:
              example:
                error: 'Server error'

  /api/studyList/createStudyList:
    post:
      summary: Create a new study list
      tags: [StudyLists]
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                subject:
                  type: string
                description:
                  type: string
                privacy:
                  type: string
              required:
                - name
                - subject
                - privacy
      responses:
        '200':
          description: Study list created successfully
          content:
            application/json:
              example:
                message: 'Study list created successfully'
                studyList:
                  id_stuList: 50
                  name: 'New Study List'
                  description: 'Description here'
                  privacy: 'public'
                  id_user: 5
                  subjects:
                    id_subject: 2
                    course: 'Calculus'
                  created_at: '2024-04-23T20:00:00Z'
        '401':
          description: Unauthorized - Token missing or invalid
          content:
            application/json:
              example:
                error: 'Unauthorized'
        '403':
          description: Forbidden - User role not allowed or profile incomplete
          content:
            application/json:
              examples:
                NotAUser:
                  summary: Not a user role
                  value:
                    message: 'You are not user'

        '422':
          description: Unprocessable Entity - Profile information missing
          content:
            application/json:
              example:
                message: 'Complete your profile first'
        '404':
          description: Not Found - Specified subject course not found
          content:
            application/json:
              example:
                error: 'Subject not found'
        '500':
          description: Internal Server Error
          content:
            application/json:
              example:
                error: 'Server error'

  /api/studyList/editStudyList/{id_stuList}:
    patch:
      summary: Edit an existing study list
      tags: [StudyLists]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id_stuList
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                privacy:
                  type: string
      responses:
        '200':
          description: Study list updated successfully
          content:
            application/json:
              example:
                message: 'Study list updated successfully'
                studyList:
                  id_stuList: 10
                  name: 'Updated Name'
                  description: 'Updated Description'
                  privacy: 'private'
                  id_user: 5
                  subjects:
                    id_subject: 3
                    course: 'Physics'
                  created_at: '2023-11-01T12:00:00Z'
        '403':
          description: Forbidden - User role not allowed, profile incomplete, or not the owner
          content:
            application/json:
              examples:
                NotAUser:
                  summary: Not a user role
                  value:
                    message: 'You are not user'

                NotOwner:
                  summary: Not the owner of the study list
                  value:
                    error: 'You are not the owner of this study list'
        '404':
          description: Not Found - Study list not found
          content:
            application/json:
              example:
                error: 'Study list not found'
        '422':
          description: Unprocessable Entity - Profile information missing
          content:
            application/json:
              example:
                message: 'Complete your profile first'
        '500':
          description: Internal Server Error
          content:
            application/json:
              example:
                error: 'Server error'

  /api/studyList/deleteStudyList/{id_stuList}:
    delete:
      summary: Delete a study list
      tags: [StudyLists]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id_stuList
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Study list deleted successfully
          content:
            application/json:
              example:
                message: 'Study list deleted successfully'
        '403':
          description: Forbidden - User role not allowed, profile incomplete, or not the owner
          content:
            application/json:
              examples:
                NotAUser:
                  summary: Not a user role
                  value:
                    message: 'You are not user'

                NotOwner:
                  summary: Not the owner
                  value:
                    error: 'You are not the owner of this study list'

        '422':
          description: Unprocessable Entity - Profile information missing
          content:
            application/json:
              example:
                message: 'Complete your profile first'
        '500':
          description: Internal Server Error
          content:
            application/json:
              example:
                error: 'Server error'

  /api/studyList/addStudylistToAddedSection/{id_stuList}:
    post:
      summary: Add an external study list to my added section
      tags: [StudyLists]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id_stuList
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Study list added to your personal "Added" section successfully
          content:
            application/json:
              example:
                message: 'Study list added to added section'
                studyList:
                  id_user: 5
                  id_stuList: 12
        '400':
          description: Bad Request - Study list already exists in your added section
          content:
            application/json:
              example:
                error: 'This study list is already added to added section'
        '403':
          description: Forbidden - User role not allowed, profile incomplete, or owner cannot add own list
          content:
            application/json:
              examples:
                NotAUser:
                  summary: Not a user role
                  value:
                    message: 'You are not user'

                OwnerError:
                  summary: Cannot add own study list
                  value:
                    error: "You are not the owner of this study list you can't add it to added section"
        '404':
          description: Not Found - Study list not found
          content:
            application/json:
              example:
                error: 'Study list not found'
        '422':
          description: Unprocessable Entity - Profile information missing
          content:
            application/json:
              example:
                message: 'Complete your profile first'
        '500':
          description: Internal Server Error
          content:
            application/json:
              example:
                error: 'Server error'

  /api/studyList/loveStudyList/{id_stuList}:
    post:
      summary: Like or dislike a study list
      tags: [StudyLists]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id_stuList
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Reaction toggled (Loved or Unloved)
          content:
            application/json:
              examples:
                Loved:
                  summary: List loved
                  value:
                    message: 'Study list loved'
                    addLoveToStudyList:
                      id_user: 5
                      id_stuList: 12
                Unloved:
                  summary: List unloved (toggled off)
                  value:
                    message: 'Study list unloved'
        '403':
          description: Forbidden - User role not allowed or profile incomplete
          content:
            application/json:
              examples:
                NotAUser:
                  summary: Not a user role
                  value:
                    message: 'You are not user'
        '404':
          description: Not Found - Study list not found
          content:
            application/json:
              example:
                error: 'Study list not found'
        '422':
          description: Unprocessable Entity - Profile information missing
          content:
            application/json:
              example:
                message: 'Complete your profile first'
        '500':
          description: Internal Server Error
          content:
            application/json:
              example:
                error: 'Server error'

  /api/studyList/addSetReminder/{id_stuList}:
    post:
      summary: Set a reminder for a study list
      tags: [StudyLists]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id_stuList
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  type: string
                  example: '2024-12-15'
                time:
                  type: string
                  example: '14:30'
              required:
                - date
                - time
      responses:
        '200':
          description: Reminder set or updated successfully
          content:
            application/json:
              examples:
                updated:
                  value:
                    message: 'Reminder updated successfully'
                    reminder_time: '2024-12-15T14:30:00.000Z'
                added:
                  value:
                    message: 'Study list added to reminder'
                    studyList:
                      id_user: 5
                      id_stuList: 12
                      reminder_time: '2024-12-15T14:30:00.000Z'
        '400':
          description: Bad Request - Invalid date format or date is in the past
          content:
            application/json:
              examples:
                invalid_format:
                  value:
                    error: 'Invalid date or time format. Use YYYY-MM-DD for date and HH:MM for time.'
                past_date:
                  value:
                    error: 'Reminder time must be in the future '
        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                error: 'Unauthorized'
        '403':
          description: Forbidden - User role not allowed or profile incomplete
          content:
            application/json:
              examples:
                NotAUser:
                  summary: Not a user role
                  value:
                    message: 'You are not user'
        '404':
          description: Not Found - Study list not found or private (not yours)
          content:
            application/json:
              example:
                error: 'Study list not found or you do not have permission.'
        '422':
          description: Unprocessable Entity - Profile information missing
          content:
            application/json:
              example:
                message: 'Complete your profile first'
        '500':
          description: Internal Server Error
          content:
            application/json:
              example:
                error: 'Server error while setting reminder'

  /api/studyList/deleteFileFromStudyList/{id_stuList}/{id_file}:
    delete:
      summary: Remove a file from a study list
      tags: [StudyLists]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id_stuList
          required: true
          schema:
            type: integer
        - in: path
          name: id_file
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: File removed from study list successfully
          content:
            application/json:
              example:
                message: 'File deleted successfully'
        '400':
          description: Bad Request - Missing IDs
          content:
            application/json:
              example:
                error: 'Missing file or study list ID'
        '403':
          description: Forbidden - User role not allowed, profile incomplete, or not the owner
          content:
            application/json:
              examples:
                NotAUser:
                  summary: Not a user role
                  value:
                    message: 'You are not user'

                NotOwner:
                  summary: Not the owner of the study list
                  value:
                    error: 'You are not the owner of this study list'
        '404':
          description: Not Found - Study list or file not found
          content:
            application/json:
              examples:
                ListNotFound:
                  value:
                    error: 'Study list not found'
                FileNotFound:
                  value:
                    error: 'File not found'
        '422':
          description: Unprocessable Entity - Profile information missing
          content:
            application/json:
              example:
                message: 'Complete your profile first'
        '500':
          description: Internal Server Error
          content:
            application/json:
              example:
                error: 'Server error'

  /api/studyList/sharchMoreSubjects:
    get:
      summary: Search for more subjects (Autocomplete)
      tags: [StudyLists]
      parameters:
        - in: query
          name: subject
          required: true
          schema:
            type: string
          description: Subject name search query
      responses:
        '200':
          description: List of matching subjects
          content:
            application/json:
              example:
                subjects: ['Mathematics', 'Matrix Theory', 'Advanced Math']
        '400':
          description: Bad Request - Missing subject query
          content:
            application/json:
              example:
                error: 'Missing subject'
        '500':
          description: Internal Server Error
          content:
            application/json:
              example:
                error: 'Server error'
